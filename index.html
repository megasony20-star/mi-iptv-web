<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPTV Web Player</title>
  <!-- HLS.js para reproducción de streams m3u8 -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-panel: #1e293b;
      --bg-card: #334155;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Barra Superior */
    header {
      background-color: var(--bg-panel);
      padding: 12px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .brand {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .controls-top {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    input[type="text"], select {
      background-color: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
    }

    input[type="text"]:focus, select:focus {
      border-color: var(--accent);
    }

    button, .file-label {
      background-color: var(--accent);
      color: #0f172a;
      font-weight: 600;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background-color 0.2s;
    }

    button:hover, .file-label:hover {
      background-color: var(--accent-hover);
    }

    input[type="file"] {
      display: none;
    }

    /* Contenedor Principal */
    .main-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 65px);
    }

    /* Reproductor */
    .player-section {
      flex: 1;
      background-color: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    video {
      width: 100%;
      height: 100%;
      max-height: calc(100vh - 65px);
      background-color: #000;
    }

    .now-playing {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(15, 23, 42, 0.85);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      pointer-events: none;
      backdrop-filter: blur(4px);
    }

    /* Barra Lateral de Canales */
    .sidebar {
      width: 360px;
      background-color: var(--bg-panel);
      display: flex;
      flex-direction: column;
      border-left: 1px solid
