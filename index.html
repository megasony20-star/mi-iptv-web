<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPTV Web Player</title>
  <!-- Motor de reproducción HLS -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg-dark: #0b0f19;
      --bg-panel: #131b2e;
      --bg-card: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --star-active: #fbbf24;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background-color: var(--bg-panel);
      padding: 10px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .controls-top {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    input[type="text"], select {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }

    input[type="text"]:focus, select:focus {
      border-color: var(--accent);
    }

    button, .file-label {
      background-color: var(--accent);
      color: #0b0f19;
      font-weight: 600;
      border: none;
      padding: 7px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background-color 0.2s;
    }

    button:hover, .file-label:hover {
      background-color: var(--accent-hover);
    }

    .cors-toggle {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.8rem;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }

    input[type="file"] {
      display: none;
    }

    .main-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 60px);
    }

    .player-section {
      flex: 1;
      background-color: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    video {
      width: 100%;
      height: 100%;
      max-height: calc(100vh - 60px);
      background-color: #000;
    }

    /* Tarjeta Superpuesta EPG */
    .epg-overlay {
      position: absolute;
      bottom: 24px;
      left: 24px;
      background: rgba(11, 15, 25, 0.88);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      max-width: 440px;
      width: calc(100% - 48px);
      backdrop-filter: blur(8px);
      display: none;
      pointer-events: none;
    }

    .epg-channel-header {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 3px;
    }

    .epg-title {
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .epg-time {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .epg-bar {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
      overflow: hidden;
    }

    .epg-progress {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.3s linear;
    }

    .sidebar {
      width: 380px;
      background-color: var(--bg-panel);
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--border);
    }

    .search-bar {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-bottom: 1px solid var(--border);
    }

    .tabs {
      display: flex;
      gap: 6px;
    }

    .tab-btn {
      flex: 1;
      background: var(--bg-card);
      color: var(--text-muted);
      padding: 6px;
      border-radius: 6px;
      border: none;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #0b0f19;
      font-weight: bold;
    }

    .channel-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
    }

    .channel-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 4px;
    }

    .channel-item:hover {
      background-color: var(--bg-card);
    }

    .channel-item.active {
      background-color: rgba(56, 189, 248, 0.15);
      border-left: 3px solid var(--accent);
    }

    .channel-logo {
      width: 34px;
      height: 34px;
      object-fit: contain;
      border-radius: 4px;
      background-color: #0b0f19;
      flex-shrink: 0;
    }

    .channel-info {
      flex: 1;
      min-width: 0;
    }

    .channel-name {
      font-size: 0.85rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .channel-program {
      font-size: 0.72rem;
      color: var(--accent);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .fav-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px 6px;
    }

    .fav-btn.active {
      color: var(--star-active);
    }

    @media (max-width: 850px) {
      .main-container {
        flex-direction: column;
      }
      .player-section {
        height: 35vh;
        flex: none;
      }
      video {
        max-height: 35vh;
      }
      .sidebar {
        width: 100%;
        flex: 1;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>📺 IPTV Player</span>
    </div>
    <div class="controls-top">
      <input type="text" id="m3uUrl" list="savedUrls" placeholder="URL M3U/M3U8..." style="min-width: 200px;">
      <datalist id="savedUrls"></datalist>

      <label class="cors-toggle" title="Actívalo si la lista, el stream o el JSON bloquean la petición por CORS">
        <input type="checkbox" id="useCorsProxy">
        <span>Proxy CORS</span>
      </label>

      <button onclick="cargarDesdeUrl()">Cargar M3U</button>
      <label class="file-label" for="fileInput">Archivo</label>
      <input type="file" id="fileInput" accept=".m3u,.m3u8">
    </div>
  </header>

  <div class="main-container">
    <!-- Reproductor -->
    <div class="player-section">
      <div id="epgOverlay" class="epg-overlay">
        <div id="epgChannel" class="epg-channel-header">-</div>
        <div id="epgTitle" class="epg-title">Transmisión en directo</div>
        <div id="epgTime" class="epg-time">--:-- - --:--</div>
        <div class="epg-bar">
          <div id="epgProgress" class="epg-progress"></div>
        </div>
      </div>
      <video id="videoPlayer" controls autoplay playsinline></video>
    </div>

    <!-- Panel Lateral -->
    <div class="sidebar">
      <div class="search-bar">
        <div class="tabs">
          <button id="tabAll" class="tab-btn active" onclick="cambiarPestaña('ALL')">Todos (<span id="countAll">0</span>)</button>
          <button id="tabFavs" class="tab-btn" onclick="cambiarPestaña('FAVS')">⭐ Favoritos (<span id="countFavs">0</span>)</button>
        </div>
        <input type="text" id="searchInput" placeholder="Buscar canal..." oninput="filtrarCanales()">
        <select id="groupSelect" onchange="filtrarCanales()">
          <option value="ALL">Todas las categorías</option>
        </select>
      </div>
      <div id="channelList" class="channel-list">
        <div style="text-align: center; color: var(--text-muted); margin-top: 40px; font-size: 0.85rem;">
          Cargando canales...
        </div>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // LISTA DE CANALES FIJOS (Agrega aquí tus canales y sus URLs de guía JSON)
    // =========================================================================
    const MIS_CANALES_FIJOS = [
      {
        name: "ENT Channel",
        group: "Entretenimiento",
        logo: "https://www.40mediagroup.com/images/channels/ent-channel.png",
        url: "https://cdn.40mediagroup.com/live/c7eds/ENT_Channel/SA_LIVE_hls_enc/tracks-v1a1/mono.ts.m3u8", // Reemplaza por la URL de stream .m3u8 real de ENT Family
        epgUrl: "https://api.40mediagroup.com/xmltv/programacion/entchannel/ahora.json"
      },
      {
        name: "ENT Family",
        group: "Entretenimiento",
        logo: "https://www.40mediagroup.com/images/channels/ent-family.png",
        url: "https://cdn.40mediagroup.com/live/c7eds/ENT_Family/SA_LIVE_hls_enc/tracks-v1a1/mono.ts.m3u8", // Reemplaza por la URL de stream .m3u8 real de ENT Family
        epgUrl: "https://api.40mediagroup.com/xmltv/programacion/entfamily/ahora.json"
      },
      {
        name: "Multimedios Monterrey",
        group: "Noticias",
        logo: "",
        url: "https://mdstrm.com/live-stream-playlist/57b4dbf5dbbfc8f16bb63ce1.m3u8
",
        epgUrl: ""
      },
      {
        name: "Estrella TV",
        group: "Entretenimiento",
        logo: "",
        url: "https://estrellatv-oando.amagi.tv/playlist.m3u8",
        epgUrl: ""
      }
      
    ];

    let canales = [...MIS_CANALES_FIJOS];
    let canalActivo = null;
    let guiaJsonActual = [];
    let vistaActual = 'ALL';
    let favoritos = JSON.parse(localStorage.getItem('iptv_favoritos') || '[]');
    let listasGuardadas = JSON.parse(localStorage.getItem('iptv_listas') || '[]');
    
    const video = document.getElementById('videoPlayer');
    const proxyUrl = 'https://corsproxy.io/?';
    let hls = null;

    // --- MANEJO DE EPG JSON ---
    function parseFechaGenerica(val) {
      if (!val) return null;
      if (typeof val === 'number') {
        return new Date(val > 1e11 ? val : val * 1000);
      }
      if (typeof val === 'string') {
        // Soporta formatos estándar ISO o cadenas numéricas
        if (/^\d+$/.test(val.trim())) {
          const num = parseInt(val.trim(), 10);
          return new Date(num > 1e11 ? num : num * 1000);
        }
        return new Date(val);
      }
      return null;
    }

    async function cargarGuiaJson(canal) {
      guiaJsonActual = [];
      actualizarVistaEPG(null);

      if (!canal || !canal.epgUrl) return;

      const useCors = document.getElementById('useCorsProxy').checked;
      const urlFinal = useCors ? proxyUrl + encodeURIComponent(canal.epgUrl) : canal.epgUrl;

      try {
        const res = await fetch(urlFinal);
        if (!res.ok) throw new Error('Error al consultar EPG');
        const data = await res.json();

        // Extraer arreglo si viene encapsulado en propiedades comunes
        if (Array.isArray(data)) {
          guiaJsonActual = data;
        } else if (data.programas && Array.isArray(data.programas)) {
          guiaJsonActual = data.programas;
        } else if (data.programs && Array.isArray(data.programs)) {
          guiaJsonActual = data.programs;
        } else if (data.guia && Array.isArray(data.guia)) {
          guiaJsonActual = data.guia;
        } else if (data.data && Array.isArray(data.data)) {
          guiaJsonActual = data.data;
        } else {
          // Si el objeto tiene llaves por día o por hora
          guiaJsonActual = Object.values(data).filter(v => typeof v === 'object');
        }

        evaluarProgramaEnVivo();
      } catch (err) {
        console.warn('No se pudo procesar la guía JSON:', err);
      }
    }

    function evaluarProgramaEnVivo() {
      if (!canalActivo || guiaJsonActual.length === 0) {
        actualizarVistaEPG(null);
        return;
      }

      const ahora = new Date();

      const prog = guiaJsonActual.find(item => {
        const dStart = parseFechaGenerica(item.start || item.inicio || item.start_time || item.hora_inicio || item.desde);
        const dEnd = parseFechaGenerica(item.end || item.stop || item.fin || item.end_time || item.hora_fin || item.hasta);

        if (dStart && dEnd && !isNaN(dStart) && !isNaN(dEnd)) {
          return ahora >= dStart && ahora <= dEnd;
        }
        return false;
      });

      actualizarVistaEPG(prog);
    }

    function actualizarVistaEPG(prog) {
      const overlay = document.getElementById('epgOverlay');
      if (!canalActivo) {
        overlay.style.display = 'none';
        return;
      }

      overlay.style.display = 'block';
      document.getElementById('epgChannel').innerText = canalActivo.name;

      if (prog) {
        const titulo = prog.title || prog.titulo || prog.name || prog.nombre || 'Programa en vivo';
        document.getElementById('epgTitle').innerText = titulo;

        const dStart = parseFechaGenerica(prog.start || prog.inicio || prog.start_time || prog.hora_inicio || prog.desde);
        const dEnd = parseFechaGenerica(prog.end || prog.stop || prog.fin || prog.end_time || prog.hora_fin || prog.hasta);

        if (dStart && dEnd && !isNaN(dStart) && !isNaN(dEnd)) {
          const formato = (d) => d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          document.getElementById('epgTime').innerText = `${formato(dStart)} - ${formato(dEnd)}`;

          const total = dEnd - dStart;
          const transcurrido = new Date() - dStart;
          const pct = Math.min(100, Math.max(0, (transcurrido / total) * 100));
          document.getElementById('epgProgress').style.width = `${pct}%`;
        } else {
          document.getElementById('epgTime').innerText = 'En emisión';
          document.getElementById('epgProgress').style.width = '0%';
        }
      } else {
        document.getElementById('epgTitle').innerText = 'Transmisión en vivo';
        document.getElementById('epgTime').innerText = canalActivo.group || '';
        document.getElementById('epgProgress').style.width = '0%';
      }
    }

    // --- REPRODUCTOR ---
    function reproducir(canal) {
      canalActivo = canal;
      cargarGuiaJson(canal);

      const useCors = document.getElementById('useCorsProxy').checked;
      let finalUrl = canal.url;
      if (useCors && !canal.url.startsWith(proxyUrl)) {
        finalUrl = proxyUrl + encodeURIComponent(canal.url);
      }

      if (Hls.isSupported()) {
        if (hls) hls.destroy();

        hls = new Hls({ enableWorker: true, lowLatencyMode: true });
        hls.loadSource(finalUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            switch (data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                hls.startLoad();
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                hls.recoverMediaError();
                break;
              default:
                hls.destroy();
                break;
            }
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = finalUrl;
        video.addEventListener('loadedmetadata', () => video.play());
      }
    }

    // --- PARSER M3U ---
    function parseM3U(contenido) {
      const lineas = contenido.split(/\r?\n/);
      const lista = [];
      let itemActual = null;

      for (let i = 0; i < lineas.length; i++) {
        const linea = lineas[i].trim();
        if (linea.startsWith('#EXTINF:')) {
          itemActual = {};
          const comaIdx = linea.lastIndexOf(',');
          itemActual.name = comaIdx !== -1 ? linea.substring(comaIdx + 1).trim() : 'Canal';
          const logoMatch = linea.match(/tvg-logo="([^"]*)"/i);
          itemActual.logo = logoMatch ? logoMatch[1] : '';
          const groupMatch = linea.match(/group-title="([^"]*)"/i);
          itemActual.group = groupMatch ? groupMatch[1] : 'General';
          itemActual.epgUrl = '';
        } else if (linea && !linea.startsWith('#') && itemActual) {
          itemActual.url = linea;
          lista.push(itemActual);
          itemActual = null;
        }
      }
      return lista;
    }

    function toggleFavorito(event, canal) {
      event.stopPropagation();
      const id = canal.url;
      const index = favoritos.indexOf(id);

      if (index === -1) favoritos.push(id);
      else favoritos.splice(index, 1);

      localStorage.setItem('iptv_favoritos', JSON.stringify(favoritos));
      actualizarContadores();
      filtrarCanales();
    }

    function cambiarPestaña(tab) {
      vistaActual = tab;
      document.getElementById('tabAll').classList.toggle('active', tab === 'ALL');
      document.getElementById('tabFavs').classList.toggle('active', tab === 'FAVS');
      filtrarCanales();
    }

    function actualizarContadores() {
      document.getElementById('countAll').innerText = canales.length;
      const favsCount = canales.filter(c => favoritos.includes(c.url)).length;
      document.getElementById('countFavs').innerText = favsCount;
    }

    function actualizarCategorias() {
      const select = document.getElementById('groupSelect');
      const grupos = new Set(canales.map(c => c.group || 'General'));
      select.innerHTML = '<option value="ALL">Todas las categorías</option>';
      grupos.forEach(grupo => {
        const opt = document.createElement('option');
        opt.value = grupo;
        opt.innerText = grupo;
        select.appendChild(opt);
      });
      actualizarContadores();
    }

    function renderizarLista(items) {
      const container = document.getElementById('channelList');
      container.innerHTML = '';

      if (items.length === 0) {
        container.innerHTML = '<div style="text-align: center; color: var(--text-muted); margin-top: 30px; font-size: 0.85rem;">No hay canales disponibles.</div>';
        return;
      }

      items.forEach((canal) => {
        const esFav = favoritos.includes(canal.url);
        const el = document.createElement('div');
        el.className = 'channel-item' + (canalActivo === canal ? ' active' : '');
        el.onclick = () => {
          document.querySelectorAll('.channel-item').forEach(i => i.classList.remove('active'));
          el.classList.add('active');
          reproducir(canal);
        };

        const img = canal.logo 
          ? `<img src="${canal.logo}" class="channel-logo" onerror="this.style.display='none'">` 
          : '<div class="channel-logo" style="display:flex;align-items:center;justify-content:center;font-size:16px;">📺</div>';

        el.innerHTML = `
          ${img}
          <div class="channel-info">
            <div class="channel-name">${canal.name}</div>
            <div class="channel-program">${canal.epgUrl ? '📅 Guía EPG disponible' : canal.group}</div>
          </div>
          <button class="fav-btn ${esFav ? 'active' : ''}">${esFav ? '★' : '☆'}</button>
        `;

        el.querySelector('.fav-btn').onclick = (e) => toggleFavorito(e, canal);
        container.appendChild(el);
      });
    }

    function filtrarCanales() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const group = document.getElementById('groupSelect').value;

      const filtrados = canales.filter(c => {
        const esFavorito = favoritos.includes(c.url);
        if (vistaActual === 'FAVS' && !esFavorito) return false;

        const coincideNombre = c.name.toLowerCase().includes(search);
        const coincideGrupo = (group === 'ALL' || c.group === group);
        return coincideNombre && coincideGrupo;
      });

      renderizarLista(filtrados);
    }

    async function cargarDesdeUrl() {
      let url = document.getElementById('m3uUrl').value.trim();
      if (!url) return alert('Por favor ingresa una URL válida.');

      const useCors = document.getElementById('useCorsProxy').checked;
      let urlFinal = useCors ? proxyUrl + encodeURIComponent(url) : url;

      try {
        const res = await fetch(urlFinal);
        if (!res.ok) throw new Error('Error al cargar la lista');
        const text = await res.text();
        const descargados = parseM3U(text);
        canales = [...MIS_CANALES_FIJOS, ...descargados];
        actualizarCategorias();
        filtrarCanales();
      } catch (err) {
        alert('No se pudo cargar la lista externa. Si da error de conexión, activa la casilla "Proxy CORS".');
      }
    }

    document.getElementById('fileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const importados = parseM3U(event.target.result);
        canales = [...MIS_CANALES_FIJOS, ...importados];
        actualizarCategorias();
        filtrarCanales();
      };
      reader.readAsText(file);
    });

    // Revalúa el programa en emisión cada 30 segundos
    setInterval(evaluarProgramaEnVivo, 30000);

    window.addEventListener('DOMContentLoaded', () => {
      actualizarCategorias();
      filtrarCanales();
      // Reproduce automáticamente el primer canal configurado
      if (MIS_CANALES_FIJOS.length > 0) {
        reproducir(MIS_CANALES_FIJOS[0]);
      }
    });
  </script>
</body>
</html>
