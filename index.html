<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPTV Web Player con EPG</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg-dark: #0b0f19;
      --bg-panel: #131b2e;
      --bg-card: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --star-active: #fbbf24;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background-color: var(--bg-panel);
      padding: 10px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .controls-top {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    input[type="text"], select {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }

    input[type="text"]:focus, select:focus {
      border-color: var(--accent);
    }

    button, .file-label {
      background-color: var(--accent);
      color: #0b0f19;
      font-weight: 600;
      border: none;
      padding: 7px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background-color 0.2s;
    }

    button:hover, .file-label:hover {
      background-color: var(--accent-hover);
    }

    .cors-toggle {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.8rem;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }

    input[type="file"] {
      display: none;
    }

    .main-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 60px);
    }

    .player-section {
      flex: 1;
      background-color: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    video {
      width: 100%;
      height: 100%;
      max-height: calc(100vh - 60px);
      background-color: #000;
    }

    /* Tarjeta EPG en pantalla */
    .epg-overlay {
      position: absolute;
      bottom: 24px;
      left: 24px;
      background: rgba(11, 15, 25, 0.88);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 18px;
      max-width: 480px;
      width: calc(100% - 48px);
      backdrop-filter: blur(8px);
      display: none;
      pointer-events: none;
    }

    .epg-channel-header {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .epg-title {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .epg-time {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .epg-bar {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
      overflow: hidden;
    }

    .epg-progress {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.3s linear;
    }

    .sidebar {
      width: 380px;
      background-color: var(--bg-panel);
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--border);
    }

    .search-bar {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-bottom: 1px solid var(--border);
    }

    .tabs {
      display: flex;
      gap: 6px;
    }

    .tab-btn {
      flex: 1;
      background: var(--bg-card);
      color: var(--text-muted);
      padding: 6px;
      border-radius: 6px;
      border: none;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #0b0f19;
      font-weight: bold;
    }

    .channel-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
    }

    .channel-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 4px;
    }

    .channel-item:hover {
      background-color: var(--bg-card);
    }

    .channel-item.active {
      background-color: rgba(56, 189, 248, 0.15);
      border-left: 3px solid var(--accent);
    }

    .channel-logo {
      width: 34px;
      height: 34px;
      object-fit: contain;
      border-radius: 4px;
      background-color: #0b0f19;
      flex-shrink: 0;
    }

    .channel-info {
      flex: 1;
      min-width: 0;
    }

    .channel-name {
      font-size: 0.85rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .channel-program {
      font-size: 0.72rem;
      color: var(--accent);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .channel-group {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .fav-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px 6px;
    }

    .fav-btn.active {
      color: var(--star-active);
    }

    @media (max-width: 850px) {
      .main-container {
        flex-direction: column;
      }
      .player-section {
        height: 35vh;
        flex: none;
      }
      video {
        max-height: 35vh;
      }
      .sidebar {
        width: 100%;
        flex: 1;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>📺 IPTV + EPG</span>
    </div>
    <div class="controls-top">
      <input type="text" id="m3uUrl" placeholder="URL M3U..." style="min-width: 180px;">
      <input type="text" id="epgUrl" placeholder="URL EPG (XMLTV)..." style="min-width: 180px;">
      
      <label class="cors-toggle" title="Actívalo si los enlaces bloquean la descarga por CORS">
        <input type="checkbox" id="useCorsProxy">
        <span>Proxy CORS</span>
      </label>

      <button onclick="cargarTodo()">Cargar</button>
      <label class="file-label" for="fileInput">M3U Local</label>
      <input type="file" id="fileInput" accept=".m3u,.m3u8">
    </div>
  </header>

  <div class="main-container">
    <div class="player-section">
      <!-- Tarjeta EPG Superpuesta -->
      <div id="epgOverlay" class="epg-overlay">
        <div id="epgChannel" class="epg-channel-header">-</div>
        <div id="epgTitle" class="epg-title">Sin información de guía</div>
        <div id="epgTime" class="epg-time">--:-- - --:--</div>
        <div class="epg-bar">
          <div id="epgProgress" class="epg-progress"></div>
        </div>
      </div>
      <video id="videoPlayer" controls autoplay playsinline></video>
    </div>

    <div class="sidebar">
      <div class="search-bar">
        <div class="tabs">
          <button id="tabAll" class="tab-btn active" onclick="cambiarPestaña('ALL')">Todos (<span id="countAll">0</span>)</button>
          <button id="tabFavs" class="tab-btn" onclick="cambiarPestaña('FAVS')">⭐ Favoritos (<span id="countFavs">0</span>)</button>
        </div>
        <input type="text" id="searchInput" placeholder="Buscar canal..." oninput="filtrarCanales()">
        <select id="groupSelect" onchange="filtrarCanales()">
          <option value="ALL">Todas las categorías</option>
        </select>
      </div>
      <div id="channelList" class="channel-list">
        <div style="text-align: center; color: var(--text-muted); margin-top: 40px; font-size: 0.85rem;">
          Cargando canales y guía...
        </div>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // CANALES FIJOS CON IDENTIFICADOR EPG (tvg_id)
    // =========================================================================
    const MIS_CANALES_FIJOS = [
      {
        name: "ENT Family",
        group: "Entretenimiento",
        logo: "https://www.40mediagroup.com/images/channels/ent-family.png", // pon aquí el logo si lo tienes
        url: "https://cdn.40mediagroup.com/live/c7eds/ENT_Family/SA_LIVE_hls_enc/tracks-v1a1/mono.ts.m3u8", // pon aquí el stream m3u8
        epgUrl: "https://api.40mediagroup.com/xmltv/programacion/entfamily/guia.json"
      },
      {
        id: "DWEspanol.de",
        name: "DW Español",
        group: "Noticias",
        logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/7/75/Deutsche_Welle_symbol_2012.svg/200px-Deutsche_Welle_symbol_2012.svg.png",
        url: "https://dwamdstream104.akamaized.net/hls/live/2015530/dwstream104/index.m3u8"
      }
    ];

    let canales = [...MIS_CANALES_FIJOS];
    let epgData = {}; // Diccionario con id_canal -> [programas]
    let canalActivo = null;
    let vistaActual = 'ALL';
    let favoritos = JSON.parse(localStorage.getItem('iptv_favoritos') || '[]');
    
    const video = document.getElementById('videoPlayer');
    const proxyUrl = 'https://corsproxy.io/?';
    let hls = null;

    // Parser de fecha estándar XMLTV (Ej: "20261012143000 +0000")
    function parseXmltvDate(dateStr) {
      if (!dateStr) return null;
      const clean = dateStr.trim();
      const year = clean.substring(0, 4);
      const month = clean.substring(4, 6) - 1;
      const day = clean.substring(6, 8);
      const hour = clean.substring(8, 10);
      const min = clean.substring(10, 12);
      const sec = clean.substring(12, 14) || '00';
      return new Date(Date.UTC(year, month, day, hour, min, sec));
    }

    // Obtener programa en vivo para un canal
    function obtenerProgramaActual(channelId) {
      const programas = epgData[channelId];
      if (!programas || programas.length === 0) return null;

      const ahora = new Date();
      return programas.find(p => p.start <= ahora && p.end >= ahora) || null;
    }

    function actualizarOverlayEPG() {
      const overlay = document.getElementById('epgOverlay');
      if (!canalActivo) {
        overlay.style.display = 'none';
        return;
      }

      overlay.style.display = 'block';
      document.getElementById('epgChannel').innerText = canalActivo.name;

      const prog = obtenerProgramaActual(canalActivo.id);
      if (prog) {
        document.getElementById('epgTitle').innerText = prog.title;
        
        const formatoHora = (d) => d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        document.getElementById('epgTime').innerText = `${formatoHora(prog.start)} - ${formatoHora(prog.end)}`;

        const total = prog.end - prog.start;
        const transcurrido = new Date() - prog.start;
        const pct = Math.min(100, Math.max(0, (transcurrido / total) * 100));
        document.getElementById('epgProgress').style.width = `${pct}%`;
      } else {
        document.getElementById('epgTitle').innerText = 'Sin información del programa';
        document.getElementById('epgTime').innerText = '--:-- - --:--';
        document.getElementById('epgProgress').style.width = '0%';
      }
    }

    // Parsear archivo XMLTV (EPG)
    async function cargarEPG(url) {
      if (!url) return;
      const useCors = document.getElementById('useCorsProxy').checked;
      const urlFinal = useCors ? proxyUrl + encodeURIComponent(url) : url;

      try {
        const res = await fetch(urlFinal);
        if (!res.ok) throw new Error('Error al descargar EPG');
        const text = await res.text();
        
        const parser = new DOMParser();
        const xml = parser.parseFromString(text, 'text/xml');
        const programmes = xml.querySelectorAll('programme');

        epgData = {};
        programmes.forEach(p => {
          const channelId = p.getAttribute('channel');
          const start = parseXmltvDate(p.getAttribute('start'));
          const end = parseXmltvDate(p.getAttribute('stop'));
          const title = p.querySelector('title') ? p.querySelector('title').textContent : 'Sin título';

          if (channelId && start && end) {
            if (!epgData[channelId]) epgData[channelId] = [];
            epgData[channelId].push({ start, end, title });
          }
        });

        actualizarOverlayEPG();
        filtrarCanales();
      } catch (err) {
        console.warn('No se pudo procesar la guía EPG:', err);
      }
    }

    function reproducir(canal) {
      canalActivo = canal;
      actualizarOverlayEPG();

      const useCors = document.getElementById('useCorsProxy').checked;
      let finalUrl = canal.url;
      if (useCors && !canal.url.startsWith(proxyUrl)) {
        finalUrl = proxyUrl + encodeURIComponent(canal.url);
      }

      if (Hls.isSupported()) {
        if (hls) hls.destroy();
        hls = new Hls({ enableWorker: true, lowLatencyMode: true });
        hls.loadSource(finalUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = finalUrl;
        video.addEventListener('loadedmetadata', () => video.play());
      }
    }

    function parseM3U(contenido) {
      const lineas = contenido.split(/\r?\n/);
      const lista = [];
      let item = null;

      for (let i = 0; i < lineas.length; i++) {
        const l = lineas[i].trim();
        if (l.startsWith('#EXTINF:')) {
          item = {};
          const comaIdx = l.lastIndexOf(',');
          item.name = comaIdx !== -1 ? l.substring(comaIdx + 1).trim() : 'Canal';
          
          const idMatch = l.match(/tvg-id="([^"]*)"/i);
          item.id = idMatch ? idMatch[1] : item.name;

          const logoMatch = l.match(/tvg-logo="([^"]*)"/i);
          item.logo = logoMatch ? logoMatch[1] : '';

          const groupMatch = l.match(/group-title="([^"]*)"/i);
          item.group = groupMatch ? groupMatch[1] : 'General';
        } else if (l && !l.startsWith('#') && item) {
          item.url = l;
          lista.push(item);
          item = null;
        }
      }
      return lista;
    }

    function renderizarLista(items) {
      const container = document.getElementById('channelList');
      container.innerHTML = '';

      if (items.length === 0) {
        container.innerHTML = '<div style="text-align: center; color: var(--text-muted); margin-top: 30px; font-size: 0.85rem;">No hay canales.</div>';
        return;
      }

      items.forEach((canal) => {
        const esFav = favoritos.includes(canal.url);
        const prog = obtenerProgramaActual(canal.id);

        const el = document.createElement('div');
        el.className = 'channel-item' + (canalActivo === canal ? ' active' : '');
        el.onclick = () => {
          document.querySelectorAll('.channel-item').forEach(i => i.classList.remove('active'));
          el.classList.add('active');
          reproducir(canal);
        };

        const img = canal.logo 
          ? `<img src="${canal.logo}" class="channel-logo" onerror="this.style.display='none'">` 
          : '<div class="channel-logo" style="display:flex;align-items:center;justify-content:center;font-size:16px;">📺</div>';

        el.innerHTML = `
          ${img}
          <div class="channel-info">
            <div class="channel-name">${canal.name}</div>
            <div class="channel-program">${prog ? '▶ ' + prog.title : canal.group}</div>
          </div>
          <button class="fav-btn ${esFav ? 'active' : ''}">${esFav ? '★' : '☆'}</button>
        `;

        el.querySelector('.fav-btn').onclick = (e) => {
          e.stopPropagation();
          const idx = favoritos.indexOf(canal.url);
          if (idx === -1) favoritos.push(canal.url);
          else favoritos.splice(idx, 1);
          localStorage.setItem('iptv_favoritos', JSON.stringify(favoritos));
          filtrarCanales();
        };

        container.appendChild(el);
      });
    }

    function filtrarCanales() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const group = document.getElementById('groupSelect').value;

      const filtrados = canales.filter(c => {
        const esFav = favoritos.includes(c.url);
        if (vistaActual === 'FAVS' && !esFav) return false;
        return c.name.toLowerCase().includes(search) && (group === 'ALL' || c.group === group);
      });

      document.getElementById('countAll').innerText = canales.length;
      document.getElementById('countFavs').innerText = canales.filter(c => favoritos.includes(c.url)).length;
      renderizarLista(filtrados);
    }

    function actualizarCategorias() {
      const select = document.getElementById('groupSelect');
      const grupos = new Set(canales.map(c => c.group || 'General'));
      select.innerHTML = '<option value="ALL">Todas las categorías</option>';
      grupos.forEach(g => {
        const opt = document.createElement('option');
        opt.value = g;
        opt.innerText = g;
        select.appendChild(opt);
      });
    }

    function cambiarPestaña(tab) {
      vistaActual = tab;
      document.getElementById('tabAll').classList.toggle('active', tab === 'ALL');
      document.getElementById('tabFavs').classList.toggle('active', tab === 'FAVS');
      filtrarCanales();
    }

    async function cargarTodo() {
      const m3u = document.getElementById('m3uUrl').value.trim();
      const epg = document.getElementById('epgUrl').value.trim();
      const useCors = document.getElementById('useCorsProxy').checked;

      if (m3u) {
        try {
          const finalUrl = useCors ? proxyUrl + encodeURIComponent(m3u) : m3u;
          const res = await fetch(finalUrl);
          const txt = await res.text();
          canales = [...MIS_CANALES_FIJOS, ...parseM3U(txt)];
          actualizarCategorias();
          filtrarCanales();
        } catch (e) {
          alert('Error cargando M3U.');
        }
      }

      if (epg) {
        cargarEPG(epg);
      }
    }

    // Actualiza la barra de progreso del programa cada minuto
    setInterval(actualizarOverlayEPG, 60000);

    window.addEventListener('DOMContentLoaded', () => {
      // Demo por defecto con EPG pública de España
      document.getElementById('m3uUrl').value = '';
      document.getElementById('epgUrl').value = 'https://api.40mediagroup.com/xmltv/programacion/entfamily/guia.json';
      
      actualizarCategorias();
      filtrarCanales();
      cargarTodo();
    });
  </script>
</body>
</html>
